# Serves the built SPA. Unknown paths fall back to index.html so client-side routes work on reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change; let browsers cache them
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
